services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: superbuilt-postgres

    environment:
      POSTGRES_DB: superbuilt
      POSTGRES_USER: superbuilt
      POSTGRES_PASSWORD: superbuilt

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbuilt -d superbuilt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: