spring.application.name=superbuilt-mini

server.port=8081

# ===============================
# PostgreSQL Configuration
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5433/superbuilt
spring.datasource.username=superbuilt
spring.datasource.password=superbuilt
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# PostgreSQL
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Document Storage
# ===============================
# Document Storage
app.document-storage-path=${DOCUMENT_STORAGE_PATH:sample-data}

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.options.model=llama3.2

# ==============================
# EMAIL CONFIGURATION
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}


#spring.mail.username=28tdeepanshu@gmail.com
#spring.mail.password=hnbl hank wlzj xzqp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================
# MORNING BRIEF CONFIGURATION
# ==============================

# Uses MAIL_USERNAME if MORNING_BRIEF_RECIPIENT is not provided.
app.morning-brief.recipient=${MORNING_BRIEF_RECIPIENT:${MAIL_USERNAME}}

# 9:00 AM every day
app.morning-brief.cron=0 0 9 * * *
app.morning-brief.zone=Asia/Kolkata